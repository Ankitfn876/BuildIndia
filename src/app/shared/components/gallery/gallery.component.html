<div class="gallery-container">
  <!-- Filters Bar -->
  <div class="gallery-filters">
    @for (cat of categories; track cat) {
      <button 
        type="button" 
        [class]="activeCategory() === cat ? 'filter-btn active' : 'filter-btn'" 
        (click)="setCategory(cat)"
      >
        {{ cat }}
      </button>
    }
  </div>

  <!-- Grid Layout -->
  <div class="gallery-grid">
    @for (item of filteredItems(); track item.id) {
      <div class="gallery-card card-hover-lift" (click)="openLightbox(item)" role="button" tabindex="0" (keydown.enter)="openLightbox(item)">
        <div class="gallery-img-box img-hover-zoom">
          <img [src]="item.image" [alt]="item.title" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1541888946425-d81bb19240f5?auto=format&fit=crop&w=600&q=80'" />
          <div class="gallery-overlay">
            <span class="gallery-tag">{{ item.category }}</span>
            <h3>{{ item.title }}</h3>
            <p>{{ item.description }}</p>
            <span class="zoom-icon"><i class="fa-solid fa-expand"></i></span>
          </div>
        </div>
      </div>
    }
  </div>

  <!-- Lightbox Overlay -->
  @if (lightboxImage()) {
    <div class="lightbox-overlay" (click)="closeLightbox()">
      <div class="lightbox-content" (click)="$event.stopPropagation()">
        <button type="button" class="lightbox-close" (click)="closeLightbox()" aria-label="Close Gallery Lightbox">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="lightbox-img-wrapper">
          <img [src]="lightboxImage()" [alt]="lightboxTitle()" />
        </div>
        <div class="lightbox-caption">
          <h3>{{ lightboxTitle() }}</h3>
        </div>
      </div>
    </div>
  }
</div>
