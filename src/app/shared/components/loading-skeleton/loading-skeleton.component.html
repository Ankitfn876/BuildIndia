<div class="skeleton-grid">
  @for (item of skeletonItems(); track $index) {
    <div class="skeleton-card">
      <div class="skeleton-image skeleton-pulse"></div>
      <div class="skeleton-content">
        <div class="skeleton-line skeleton-title skeleton-pulse"></div>
        <div class="skeleton-line skeleton-text skeleton-pulse"></div>
        <div class="skeleton-line skeleton-text-short skeleton-pulse"></div>
        <div class="skeleton-footer">
          <div class="skeleton-price skeleton-pulse"></div>
          <div class="skeleton-button skeleton-pulse"></div>
        </div>
      </div>
    </div>
  }
</div>
