<header class="header-main">
  <div class="container nav-container">
    <!-- Brand Logo -->
    <a routerLink="/" class="logo" (click)="closeMobileMenu()">
      <span class="logo-accent">Build</span><span class="logo-highlight">India</span>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="nav-desktop">
      <ul class="nav-list">
        @for (link of navLinks; track link.path) {
          <li>
            <a [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{exact: link.path === '/'}" class="nav-link">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <!-- Mobile Menu Toggle Button -->
      <button class="mobile-toggle" (click)="toggleMobileMenu()" [attr.aria-expanded]="isMobileMenuOpen()" aria-label="Toggle Navigation Menu">
        @if (isMobileMenuOpen()) {
          <i class="fa-solid fa-xmark"></i>
        } @else {
          <i class="fa-solid fa-bars"></i>
        }
      </button>
    </div>
  </div>

  <!-- Mobile Drawer Menu Overlay -->
  <div class="mobile-drawer" [ngClass]="{ 'open': isMobileMenuOpen() }">
    <div class="drawer-header">
      <a routerLink="/" class="logo" (click)="closeMobileMenu()">
        <span class="logo-accent">Build</span><span class="logo-highlight">India</span>
      </a>
      <button class="drawer-close" (click)="closeMobileMenu()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    
    <nav class="nav-mobile-list">
      @for (link of navLinks; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{exact: link.path === '/'}" class="mobile-nav-link" (click)="closeMobileMenu()">
          {{ link.label }}
        </a>
      }
    </nav>
  </div>
  @if (isMobileMenuOpen()) {
    <div class="drawer-backdrop" (click)="closeMobileMenu()"></div>
  }
</header>
