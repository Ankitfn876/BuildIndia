<div class="testimonials-grid grid-3">
  @for (item of testimonials; track item.id) {
    <div class="testimonial-card card-hover-lift">
      <!-- Quote Icon -->
      <div class="quote-icon">
        <i class="fa-solid fa-quote-right"></i>
      </div>
      
      <!-- Star Ratings -->
      <div class="rating-stars">
        @for (star of generateStars(item.rating); track $index) {
          <i class="fa-solid fa-star"></i>
        }
      </div>

      <!-- Text -->
      <p class="testimonial-text">"{{ item.text }}"</p>

      <!-- User Profile -->
      <div class="user-profile">
        <div class="profile-avatar">
          <img 
            [src]="item.avatar" 
            [alt]="item.name" 
            onerror="this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=120&h=120&q=80'" 
            loading="lazy" 
          />
        </div>
        <div class="profile-meta">
          <h4>{{ item.name }}</h4>
          <span class="role">
            @if (item.company) {
              {{ item.role }}, {{ item.company }}
            } @else {
              {{ item.role }}
            }
          </span>
          <span class="location"><i class="fa-solid fa-location-dot"></i> {{ item.location }}</span>
        </div>
      </div>
    </div>
  }
</div>
